---
ignore:
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/558
  - vulnerability: CVE-2015-5237
    package:
      name: google.golang.org/protobuf
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/633
  - vulnerability: CVE-2021-22570
    package:
      name: google.golang.org/protobuf
  # Fix requires docker/docker v28→v29 major upgrade, incompatible with this branch
  - vulnerability: GHSA-x744-4wpc-v9h2
    package:
      name: github.com/docker/docker
  # No fix available for docker/docker
  - vulnerability: GHSA-pxq6-2prw-chj9
    fix-state: not-fixed
    package:
      name: github.com/docker/docker
  # Ignore all docker CVEs in tools directory (build-time only, not production)
  - package:
      name: github.com/docker/docker
      location: /tools/go.mod

  # No fix available
  - vulnerability: GO-2026-5064
    fix-state: unknown
    package:
      name: github.com/containerd/containerd
      location: /tools/go.mod

  # No fix available
  - vulnerability: GO-2026-5338
    fix-state: unknown
    package:
      name: github.com/containerd/containerd
      location: /tools/go.mod

  # No fix available
  - vulnerability: GO-2026-5622
    fix-state: unknown
    package:
      name: github.com/containerd/containerd
      location: /tools/go.mod

  # No fix available
  - vulnerability: GO-2026-5932
    fix-state: unknown
    package:
      name: golang.org/x/crypto
      location: /tools/go.mod
