---
ignore:
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/558
  - vulnerability: CVE-2015-5237
    package:
      name: google.golang.org/protobuf
  # False positive, CVE is actually about the C++ project protocolbuffers/protobuf
  # https://github.com/anchore/grype/issues/633
  - vulnerability: CVE-2021-22570
    package:
      name: google.golang.org/protobuf
  # The fixed helm version also pulls in K8s 1.33 et al so ignore the vulnerability
  # as it's only in the tools module.
  - vulnerability: GHSA-557j-xg8c-q2mm
    package:
      name: helm.sh/helm/v3
  # No fix available for docker/docker. Tool dependency only, not production code.
  - vulnerability: GHSA-x744-4wpc-v9h2
    package:
      name: github.com/docker/docker
  # No fix available for docker/docker. Tool dependency only, not production code.
  - vulnerability: GHSA-pxq6-2prw-chj9
    package:
      name: github.com/docker/docker
  # Update requires helm.sh/helm/v3 v3.20.2. Moderate doesn't justify breaking changes.
  - vulnerability: GHSA-hr2v-4r36-88hr
    package:
      name: helm.sh/helm/v3
  # Update requires go.opentelemetry.io/otel/sdk v1.43.0. High severity, but only affects BSD/Solaris with PATH hijacking.
  - vulnerability: GHSA-hfvc-g4fc-pqhx
    package:
      name: go.opentelemetry.io/otel/sdk
