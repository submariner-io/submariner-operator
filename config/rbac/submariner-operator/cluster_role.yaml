---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: submariner-operator
rules:
  - apiGroups:
      - submariner.io
    resources:
      - brokers
      - brokers/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
  # submariner-operator updates the config map of core-dns to forward requests to
  # clusterset.local to Lighthouse DNS, also looks at existing configmaps
  # to figure out network settings
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - list
      - watch
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - watch
  - apiGroups:
      - ""
    resources:
      # Needed for network settings discovery
      - pods
      - services
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - operator.openshift.io
    resources:
      - dnses
    verbs:
      - get
      - update
  - apiGroups:
      - config.openshift.io
    resources:
      # Needed for network settings discovery
      - networks
    resourceNames:
      - cluster
    verbs:
      - get
  - apiGroups:
      - monitoring.coreos.com
    resources:
      # Needed for openshift monitoring
      - servicemonitors
    verbs:
      - get
      - create
  - apiGroups:
      - apps
    resources:
      # Needed for Flannel / Cilium CNI discovery
      - daemonsets
    verbs:
      - get
      - list
  - apiGroups:
      - networking.k8s.io
    resources:
      # Needed for service CIDR discovery
      - servicecidrs
    verbs:
      - get
      - list
  # Cilium ClusterMesh-shaped publisher: merge/remove only the Submariner peer in
  # cilium-clustermesh (namespace from Submariner.spec.ciliumNamespace). create
  # cannot be restricted by resourceNames; other verbs are scoped. On cleanup we
  # only remove our keys and leave the Secret (possibly empty); Cilium mounts it
  # optional: true.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - cilium-clustermesh
    verbs:
      - get
      - list
      - update
      - patch
